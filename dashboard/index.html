<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android 自動試験システム</title>
  <style>
    /* ── リセット & 変数 ───────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #273549;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --fail: #ef4444;
      --warn: #f59e0b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --font: 'Segoe UI', system-ui, sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font);
           min-height: 100vh; }

    /* ── ヘッダー ───────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--muted);
      transition: background .3s;
    }
    .status-dot.running  { background: var(--success); animation: pulse 1.2s infinite; }
    .status-dot.error    { background: var(--fail); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    #elapsed { margin-left: auto; font-size:.85rem; color: var(--muted); }

    /* ── メインレイアウト ────────────────────────────── */
    .layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 53px); }

    /* ── 左パネル ───────────────────────────────────── */
    .left-panel {
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .section-title {
      font-size: .75rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing:.05em;
      margin-bottom: 8px;
    }
    select, input[type=text] {
      width: 100%; padding: 8px 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: .9rem;
    }
    select:focus, input:focus { outline: 2px solid var(--accent); border-color: transparent; }

    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      font-size: .9rem; font-weight: 600; cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-start  { background: var(--accent); color: #fff; }
    .btn-start:hover { background: var(--accent-hover); }
    .btn-start:disabled { background: var(--border); color: var(--muted); cursor: default; }
    .btn-stop   { background: var(--fail); color: #fff; }
    .btn-stop:hover { background: #dc2626; }
    .btn-stop:disabled { background: var(--border); color: var(--muted); cursor: default; }

    /* KPIカード */
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .kpi {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; text-align: center;
    }
    .kpi-val { font-size: 1.5rem; font-weight: 700; }
    .kpi-label { font-size: .7rem; color: var(--muted); margin-top: 2px; }
    .kpi-val.pass { color: var(--success); }
    .kpi-val.fail { color: var(--fail); }

    /* デバイス / 機材リスト */
    .item-list { display: flex; flex-direction: column; gap: 6px; }
    .item-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 12px;
      display: flex; align-items: center; gap: 8px;
      font-size: .82rem;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.on { background: var(--success); }
    .dot.off { background: var(--muted); }
    .item-name { font-weight: 500; }
    .item-sub  { color: var(--muted); font-size: .75rem; margin-left: auto; }

    /* ── 右パネル ───────────────────────────────────── */
    .right-panel {
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .tabs {
      display: flex; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 12px 20px; font-size: .9rem; cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--muted); transition: color .15s, border-color .15s;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab-content { flex: 1; overflow: hidden; display: none; }
    .tab-content.active { display: flex; flex-direction: column; }

    /* ログ */
    #log-container {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: .82rem; line-height: 1.6;
    }
    .log-line { display: flex; gap: 8px; }
    .log-time  { color: var(--muted); flex-shrink: 0; }
    .log-msg.INFO  { color: var(--text); }
    .log-msg.ERROR { color: var(--fail); }
    .log-msg.WARN  { color: var(--warn); }
    .log-pass  { color: var(--success); }
    .log-fail  { color: var(--fail); }

    /* 試験結果テーブル */
    #results-container { flex: 1; overflow-y: auto; padding: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th {
      background: var(--surface); padding: 10px 12px;
      text-align: left; font-weight: 600; color: var(--muted);
      border-bottom: 1px solid var(--border); position: sticky; top: 0;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    tr:hover td { background: var(--surface2); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: .78rem; font-weight: 600;
    }
    .badge.PASS { background: rgba(34,197,94,.15); color: var(--success); }
    .badge.FAIL { background: rgba(239,68,68,.15);  color: var(--fail); }

    /* ステップ進捗 */
    #steps-container { flex: 1; overflow-y: auto; padding: 16px; }
    .step-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 8px; margin-bottom: 6px;
      background: var(--surface2); border: 1px solid var(--border);
      font-size: .85rem; transition: background .2s;
    }
    .step-row.current { border-color: var(--accent); background: rgba(59,130,246,.08); }
    .step-row.pass    { border-color: var(--success); }
    .step-row.fail    { border-color: var(--fail); }
    .step-id   { color: var(--muted); width: 30px; flex-shrink: 0; }
    .step-desc { flex: 1; }
    .step-icon { font-size: 1rem; }
  </style>
</head>
<body>

<header>
  <div class="status-dot" id="status-dot"></div>
  <h1>Android 自動試験システム</h1>
  <span id="elapsed"></span>
</header>

<div class="layout">

  <!-- ── 左パネル ─────────────────────────────────── -->
  <aside class="left-panel">

    <!-- シナリオ選択 -->
    <div>
      <div class="section-title">試験シナリオ</div>
      <select id="scenario-select">
        <option value="">読み込み中...</option>
      </select>
    </div>

    <!-- 端末選択 -->
    <div>
      <div class="section-title">Android端末</div>
      <select id="device-select">
        <option value="">読み込み中...</option>
      </select>
      <div class="item-list" id="device-list" style="margin-top:8px"></div>
    </div>

    <!-- 試験操作ボタン -->
    <button class="btn btn-start" id="btn-start" onclick="startTest()">▶ 試験開始</button>
    <button class="btn btn-stop"  id="btn-stop"  onclick="stopTest()" disabled>⏹ 試験中断</button>

    <!-- KPI -->
    <div>
      <div class="section-title">結果サマリー</div>
      <div class="kpi-grid">
        <div class="kpi"><div class="kpi-val" id="kpi-total">—</div><div class="kpi-label">総ステップ</div></div>
        <div class="kpi"><div class="kpi-val pass" id="kpi-pass">—</div><div class="kpi-label">PASS</div></div>
        <div class="kpi"><div class="kpi-val fail" id="kpi-fail">—</div><div class="kpi-label">FAIL</div></div>
        <div class="kpi"><div class="kpi-val" id="kpi-rate">—</div><div class="kpi-label">PASS率</div></div>
      </div>
    </div>

    <!-- 計測器 -->
    <div>
      <div class="section-title">計測器</div>
      <div class="item-list" id="instrument-list"></div>
    </div>

  </aside>

  <!-- ── 右パネル ─────────────────────────────────── -->
  <main class="right-panel">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('log')">リアルタイムログ</div>
      <div class="tab" onclick="switchTab('steps')">ステップ進捗</div>
      <div class="tab" onclick="switchTab('results')">試験結果履歴</div>
    </div>

    <!-- ログタブ -->
    <div class="tab-content active" id="tab-log">
      <div id="log-container"></div>
    </div>

    <!-- ステップタブ -->
    <div class="tab-content" id="tab-steps">
      <div id="steps-container"></div>
    </div>

    <!-- 結果タブ -->
    <div class="tab-content" id="tab-results">
      <div id="results-container">
        <table>
          <thead>
            <tr>
              <th>日時</th><th>シナリオ</th><th>端末</th>
              <th>結果</th><th>PASS</th><th>FAIL</th>
            </tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const API = 'http://localhost:8000';
let ws = null;
let elapsedTimer = null;
let startTimestamp = null;
let currentSteps = [];

// ── 初期化 ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadScenarios();
  loadDevices();
  loadInstruments();
  loadResults();
  connectWebSocket();
  pollStatus();
  setInterval(pollStatus, 3000);
});

// ── API ヘルパー ─────────────────────────────────────────
async function api(method, path, body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || res.statusText);
  }
  return res.json();
}

// ── シナリオ読み込み ─────────────────────────────────────
async function loadScenarios() {
  const sel = document.getElementById('scenario-select');
  try {
    const list = await api('GET', '/scenarios');
    sel.innerHTML = list.map(s =>
      `<option value="${s.name}">${s.display_name || s.name} (${s.step_count}ステップ)</option>`
    ).join('');
  } catch(e) { sel.innerHTML = '<option>取得失敗</option>'; }
}

// ── デバイス読み込み ─────────────────────────────────────
async function loadDevices() {
  const sel = document.getElementById('device-select');
  const list = document.getElementById('device-list');
  try {
    const devices = await api('GET', '/devices');
    if (devices.length === 0) {
      sel.innerHTML = '<option value="">端末が見つかりません</option>';
      list.innerHTML = '<div style="color:var(--muted);font-size:.8rem">ADB接続された端末がありません</div>';
      return;
    }
    sel.innerHTML = devices.map(d =>
      `<option value="${d.id}">${d.model || d.id}</option>`
    ).join('');
    list.innerHTML = devices.map(d => `
      <div class="item-card">
        <div class="dot on"></div>
        <div>
          <div class="item-name">${d.model || d.id}</div>
          <div style="font-size:.72rem;color:var(--muted)">${d.id}</div>
        </div>
      </div>`).join('');
  } catch(e) {
    sel.innerHTML = '<option value="">Android Agentに接続中...</option>';
  }
}

// ── 計測器読み込み ───────────────────────────────────────
async function loadInstruments() {
  const list = document.getElementById('instrument-list');
  try {
    const instruments = await api('GET', '/instruments');
    list.innerHTML = instruments.map(inst => `
      <div class="item-card">
        <div class="dot ${inst.connected ? 'on' : 'off'}"></div>
        <div class="item-name">${inst.name}</div>
        <div class="item-sub">${inst.connected ? '接続中' : '未接続'}</div>
      </div>`).join('');
  } catch(e) {
    list.innerHTML = '<div style="color:var(--muted);font-size:.8rem">Equipment Agentに接続中...</div>';
  }
}

// ── 試験開始 ─────────────────────────────────────────────
async function startTest() {
  const scenario = document.getElementById('scenario-select').value;
  const device   = document.getElementById('device-select').value;
  if (!scenario || !device) { alert('シナリオと端末を選択してください'); return; }
  try {
    await api('POST', '/test/start', { scenario_name: scenario, device_id: device });
    clearLog();
    currentSteps = [];
    renderSteps();
  } catch(e) { alert('試験開始エラー: ' + e.message); }
}

// ── 試験停止 ─────────────────────────────────────────────
async function stopTest() {
  try { await api('POST', '/test/stop'); }
  catch(e) { alert('停止エラー: ' + e.message); }
}

// ── ステータスポーリング ─────────────────────────────────
async function pollStatus() {
  try {
    const s = await api('GET', '/test/status');
    updateStatusUI(s);
  } catch(e) {}
}

function updateStatusUI(s) {
  const dot = document.getElementById('status-dot');
  const btnStart = document.getElementById('btn-start');
  const btnStop  = document.getElementById('btn-stop');
  const elapsed  = document.getElementById('elapsed');

  dot.className = 'status-dot ' + (s.status === 'running' ? 'running' : '');
  btnStart.disabled = s.status === 'running';
  btnStop.disabled  = s.status !== 'running';
  elapsed.textContent = s.status === 'running'
    ? `⏱ ${s.elapsed || ''}  ${s.scenario || ''}`
    : '';

  if (s.current_step) {
    markCurrentStep(s.current_step.id);
  }
}

// ── WebSocket ログ受信 ───────────────────────────────────
function connectWebSocket() {
  ws = new WebSocket(`ws://localhost:8000/ws/log`);
  ws.onmessage = (e) => {
    const entry = JSON.parse(e.data);
    appendLog(entry);
  };
  ws.onclose = () => setTimeout(connectWebSocket, 3000);
}

function clearLog() {
  document.getElementById('log-container').innerHTML = '';
}

function appendLog(entry) {
  const container = document.getElementById('log-container');
  const line = document.createElement('div');
  line.className = 'log-line';
  const msgClass = entry.message.includes('PASS') ? 'log-pass'
                 : entry.message.includes('FAIL') ? 'log-fail'
                 : `log-msg ${entry.level || 'INFO'}`;
  line.innerHTML = `
    <span class="log-time">${entry.timestamp}</span>
    <span class="${msgClass}">${escHtml(entry.message)}</span>`;
  container.appendChild(line);
  container.scrollTop = container.scrollHeight;

  // 試験完了時に結果を更新
  if (entry.message.includes('試験完了')) {
    setTimeout(() => { loadResults(); pollStatus(); }, 500);
    updateKpiFromLog(entry.message);
  }
}

function updateKpiFromLog(msg) {
  const m = msg.match(/\((\d+)\/(\d+) PASS\)/);
  if (!m) return;
  const passed = parseInt(m[1]), total = parseInt(m[2]), failed = total - passed;
  document.getElementById('kpi-total').textContent = total;
  document.getElementById('kpi-pass').textContent  = passed;
  document.getElementById('kpi-fail').textContent  = failed;
  document.getElementById('kpi-rate').textContent  = Math.round(passed / total * 100) + '%';
}

// ── ステップ進捗 ─────────────────────────────────────────
function renderSteps() {
  const container = document.getElementById('steps-container');
  container.innerHTML = currentSteps.map(s => `
    <div class="step-row ${s.status}" id="step-${s.id}">
      <div class="step-id">#${s.id}</div>
      <div class="step-desc">${escHtml(s.description)}</div>
      <div class="step-icon">${s.status === 'pass' ? '✅' : s.status === 'fail' ? '❌' : s.status === 'current' ? '▶' : '—'}</div>
    </div>`).join('');
}

function markCurrentStep(id) {
  document.querySelectorAll('.step-row').forEach(el => {
    if (el.classList.contains('current')) el.classList.remove('current');
  });
  const el = document.getElementById(`step-${id}`);
  if (el) { el.classList.add('current'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

// ── 結果履歴 ─────────────────────────────────────────────
async function loadResults() {
  try {
    const results = await api('GET', '/results');
    const tbody = document.getElementById('results-tbody');
    tbody.innerHTML = results.map(r => `
      <tr>
        <td>${r.timestamp?.substring(0,19).replace('T',' ') || ''}</td>
        <td>${escHtml(r.scenario)}</td>
        <td>${escHtml(r.device_id)}</td>
        <td><span class="badge ${r.result}">${r.result}</span></td>
        <td style="color:var(--success)">${r.pass_count}</td>
        <td style="color:var(--fail)">${r.fail_count}</td>
      </tr>`).join('');
  } catch(e) {}
}

// ── タブ切替 ─────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const names = ['log','steps','results'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'results') loadResults();
}

// ── ユーティリティ ───────────────────────────────────────
function escHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
