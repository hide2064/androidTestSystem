version: "3.9"

services:

  # ① Web Dashboard (Vue 3 + Nginx)
  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      orchestrator:
        condition: service_healthy
      analysis-service:
        condition: service_healthy
    restart: unless-stopped

  # ② Test Orchestrator（司令塔）
  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./orchestrator/scenarios:/app/scenarios
      - ./results:/app/results
    environment:
      - ANDROID_AGENT_URL=http://android-agent:5000
      - EQUIPMENT_AGENT_URL=http://equipment-agent:5001
      - SHAREPOINT_SITE_URL=${SHAREPOINT_SITE_URL}
      - SHAREPOINT_TENANT_ID=${SHAREPOINT_TENANT_ID}
      - SHAREPOINT_CLIENT_ID=${SHAREPOINT_CLIENT_ID}
      - SHAREPOINT_CLIENT_SECRET=${SHAREPOINT_CLIENT_SECRET}
      - TEST_SITE=${TEST_SITE:-default}
      # MySQL 接続
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=testuser
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=testSystemDB
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy
      android-agent:
        condition: service_healthy
      equipment-agent:
        condition: service_healthy
    restart: unless-stopped

  # ③ Android Agent（ADB + Appium クライアント）
  android-agent:
    build: ./android-agent
    ports:
      - "5000:5000"
    environment:
      - ADB_SERVER_HOST=host.docker.internal
      - ADB_SERVER_PORT=5037
      - APPIUM_URL=http://appium:4723
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      appium:
        condition: service_healthy
    restart: unless-stopped

  # ④ Appium Server（公式イメージ）
  appium:
    image: appium/appium:latest
    ports:
      - "4723:4723"
    environment:
      - ADB_SERVER_HOST=host.docker.internal
      - ADB_SERVER_PORT=5037
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4723/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ⑤ Equipment Agent（計測器・試験機材）
  equipment-agent:
    build: ./equipment-agent
    ports:
      - "5001:5001"
    volumes:
      - ./equipment-agent/config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ⑥ Analysis Service（opeAnyalyze バックエンド）
  analysis-service:
    build: ./analysis-service
    ports:
      - "8001:8001"
    environment:
      # RF データ (cellularAnylyze)
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=testuser
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=cellularAnylyze
      # Android 試験結果 (testSystemDB)
      - ANDROID_DB_HOST=mysql
      - ANDROID_DB_PORT=3306
      - ANDROID_DB_USER=testuser
      - ANDROID_DB_PASSWORD=${DB_PASSWORD}
      - ANDROID_DB_NAME=testSystemDB
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ⑦ MySQL 8.4（共通データストア）
  mysql:
    image: mysql:8.4
    ports:
      - "13306:3306"   # ホスト3306はMySQL84が使用中のため13306にマップ
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=testuser
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  default:
    name: test-system-network
